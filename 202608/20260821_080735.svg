<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
<rect width="760" height="330" fill="#1C1C1C"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3c2b7"/></marker>
<marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/></marker>
<marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/></marker>
</defs>
<text x="24" y="34" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="20" fill="#ffffff" font-weight="600" font-style="normal" text-anchor="start">확률변수 : 두 무대를 잇는 함수</text>
<text x="24" y="58" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="14" fill="#898781" font-weight="400" font-style="normal" text-anchor="start">표본공간 위의 확률 P 를 실수 위의 분포 <tspan font-style="italic">P</tspan><tspan font-size="11" dy="4">x</tspan><tspan dy="-4"> 로 옮김</tspan></text>
<ellipse cx="145" cy="205" rx="112" ry="80" fill="none" stroke="#898781" stroke-width="2"/>
<text x="145" y="111" font-family="STIX Two Math, Apple Symbols, Times New Roman, serif" font-size="15" fill="#ffffff" font-weight="600" font-style="normal" text-anchor="middle">(𝒳, P)</text>
<ellipse cx="155" cy="201" rx="56" ry="42" fill="none" stroke="#c3c2b7" stroke-width="2" stroke-dasharray="5 5"/>
<text x="161" y="267" font-family="STIX Two Math, Apple Symbols, Times New Roman, serif" font-size="14" fill="#c3c2b7" font-weight="400" font-style="normal" text-anchor="middle">{ ω : x(ω) ∈ B }</text>
<circle cx="128" cy="201" r="7" fill="#ffffff" stroke="#1C1C1C" stroke-width="2"/>
<text x="114" y="206" font-family="STIX Two Math, Apple Symbols, Times New Roman, serif" font-size="15" fill="#ffffff" font-weight="600" font-style="normal" text-anchor="end">ω</text>
<line x1="271" y1="205" x2="452" y2="205" stroke="#c3c2b7" stroke-width="2" marker-end="url(#ar)"/>
<text x="363.5" y="191" font-family="STIX Two Math, Apple Symbols, Times New Roman, serif" font-size="16" fill="#ffffff" font-weight="600" font-style="italic" text-anchor="middle">x</text>
<text x="363.5" y="231" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="14" fill="#898781" font-weight="400" font-style="normal" text-anchor="middle">확률변수</text>
<line x1="470" y1="205" x2="730" y2="205" stroke="#898781" stroke-width="2" marker-end="url(#arx)"/>
<text x="726" y="183" font-family="STIX Two Math, Apple Symbols, Times New Roman, serif" font-size="15" fill="#ffffff" font-weight="600" font-style="normal" text-anchor="end">ℝ</text>
<line x1="548" y1="205" x2="692" y2="205" stroke="#3987e5" stroke-width="9" stroke-linecap="butt"/>
<text x="696" y="233" font-family="STIX Two Math, Apple Symbols, Times New Roman, serif" font-size="15" fill="#ffffff" font-weight="600" font-style="italic" text-anchor="end">B</text>
<circle cx="604" cy="205" r="7" fill="#ffffff" stroke="#1C1C1C" stroke-width="2"/>
<text x="604" y="183" font-family="STIX Two Math, Apple Symbols, Times New Roman, serif" font-size="15" fill="#ffffff" font-weight="600" font-style="normal" text-anchor="middle">x(ω)</text>
<path d="M 620.0 171 C 540 116, 320 106, 197 170" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#ard)"/>
<text x="392" y="104" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="14" fill="#898781" font-weight="400" font-style="normal" text-anchor="middle">역상으로 되돌아가 P 로 계산</text>
<text x="380.0" y="304" font-family="STIX Two Math, Apple Symbols, Times New Roman, serif" font-size="16" fill="#ffffff" font-weight="600" font-style="normal" text-anchor="middle"><tspan font-style="italic">P</tspan><tspan font-size="12" dy="4">x</tspan><tspan dy="-4">(B) = P( x ∈ B ) = P( { ω : x(ω) ∈ B } )</tspan></text>
</svg>
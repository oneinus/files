<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
<rect width="760" height="330" fill="#1C1C1C"/>
<defs>
<marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3987e5"/></marker>
<marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e66767"/></marker>
</defs>
<text x="24" y="34" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="20" fill="#ffffff" font-weight="600" text-anchor="start">할증률과 할인율 : 방향만 다른 같은 값</text>
<text x="24" y="58" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="14" fill="#898781" font-weight="400" text-anchor="start">원금 100원, 이자율 10%, 1년 기준</text>
<rect x="72" y="153.0" width="190" height="66" rx="8" fill="none" stroke="#898781" stroke-width="2"/>
<text x="167.0" y="139.0" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">현재</text>
<text x="167.0" y="195" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="22" fill="#ffffff" font-weight="600" text-anchor="middle">100원</text>
<rect x="498" y="153.0" width="190" height="66" rx="8" fill="none" stroke="#898781" stroke-width="2"/>
<text x="593.0" y="139.0" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">미래 1년</text>
<text x="593.0" y="195" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="22" fill="#ffffff" font-weight="600" text-anchor="middle">110원</text>
<line x1="288" y1="160" x2="472" y2="160" stroke="#3987e5" stroke-width="2" marker-end="url(#up)"/>
<text x="380.0" y="146" font-family="STIX Two Math, Apple Symbols, Times New Roman, serif" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">× (1 + 0.1)</text>
<text x="380.0" y="122" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="14" fill="#3987e5" font-weight="600" text-anchor="middle">할증 · 미래로 보낼 때는 곱함</text>
<line x1="472" y1="212" x2="288" y2="212" stroke="#e66767" stroke-width="2" marker-end="url(#dn)"/>
<text x="380.0" y="238" font-family="STIX Two Math, Apple Symbols, Times New Roman, serif" font-size="16" fill="#ffffff" font-weight="600" text-anchor="middle">÷ (1 + 0.1)</text>
<text x="380.0" y="262" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="14" fill="#e66767" font-weight="600" text-anchor="middle">할인 · 현재로 당길 때는 나눔</text>
<line x1="24" y1="272" x2="736" y2="272" stroke="#898781" stroke-width="1"/>
<text x="24" y="302" font-family="Apple SD Gothic Neo, Helvetica Neue, sans-serif" font-size="15" fill="#ffffff" font-weight="600" text-anchor="start">이자율 · 할증률 · 할인율은 모두 같은 10%. 어느 방향으로 옮기느냐에 따라 이름만 달라짐</text>
</svg>